<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avtohiša Sallaumines — FIN ARS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="animated-bg"></div>
  <nav class="nav" id="nav">
    <a href="../index.html" class="logo">FIN ARS <span>d.o.o.</span></a>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Domov</a></li>
      <li><a href="../projekti.html" class="active">Projekti</a></li>
      <li><a href="../o-nas.html">O nas</a></li>
      <li><a href="../kontakt.html">Kontakt</a></li>
    </ul>
  </nav>
  <div class="project-hero">
    <img src="https://www.finars.si/projekti/2007%206%20avtohisa%20s/01s.jpg" alt="Avtohiša" onerror="this.src='https://www.finars.si/projekti/2013%204%20hisa%20v%20gozdu/03s.jpg'">
    <div class="caption"><h1>Avtohiša Sallaumines</h1></div>
  </div>
  <section class="section">
    <div class="project-meta">
      <div><strong>Leto</strong>2007</div>
      <div><strong>Avtorji</strong>FIN ARS ekipa</div>
    </div>
    <p style="font-size: 1.15rem; color: var(--text-secondary); max-width: 800px;">Avtohiša Sallaumines – specializiran objekt za prodajo in servis vozil z jasno funkcionalno shemo in sodobno podobo.</p>
    <div class="gallery" id="gallery">
      <img src="https://www.finars.si/projekti/2007%206%20avtohisa%20s/01s.jpg" alt="1" loading="lazy" onerror="this.style.display='none'">
      <img src="https://www.finars.si/projekti/2007%206%20avtohisa%20s/02s.jpg" alt="2" loading="lazy" onerror="this.style.display='none'">
      <img src="https://www.finars.si/projekti/2007%206%20avtohisa%20s/03s.jpg" alt="3" loading="lazy" onerror="this.style.display='none'">
    </div>
    <p style="margin-top: 2rem;"><a href="../projekti.html" style="color: var(--text-secondary);">← Nazaj na projekte</a></p>
  </section>
  <div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightboxClose">×</button><img src="" id="lightboxImg"></div>
  <footer><p>© 2026 FIN ARS d.o.o.</p></footer>
  <script>
    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
    window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 50));
    const lb = document.getElementById('lightbox'), li = document.getElementById('lightboxImg');
    document.querySelectorAll('#gallery img').forEach(img => img.addEventListener('click', () => { li.src = img.src; lb.classList.add('active'); }));
    document.getElementById('lightboxClose').addEventListener('click', () => lb.classList.remove('active'));
    lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('active'); });
  </script>
</body>
</html>
